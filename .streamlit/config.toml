# Tema Noir Industrial — tema central do dashboard
# Paleta definida em tema.py (fonte única de verdade).
[theme]
base = "dark"
primaryColor = "#CC5500"           # Acento primário — laranja ferrugem
backgroundColor = "#111111"        # Background principal — grafite
secondaryBackgroundColor = "#1C1C1E"  # Cards / Sidebar — cinza chumbo
textColor = "#D4D4D4"              # Texto principal — branco sujo
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
