# Tema Gótico Vitoriano — tema central do dashboard
# Paleta definida em tema.py (fonte única de verdade).
[theme]
base = "dark"
primaryColor = "#8B0000"           # Acento primário — vermelho sangue
backgroundColor = "#0D0D0D"        # Background principal — preto carvão
secondaryBackgroundColor = "#1A0A0A"  # Cards / Sidebar — bordô escuro
textColor = "#E8DCC8"              # Texto principal — pergaminho
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
